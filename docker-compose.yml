services:
  ripper:
    build: .
    container_name: disc-ripper
    restart: unless-stopped
    # A small init as PID 1 reaps exited processes. The app (PID 1 otherwise) does not, and
    # every makemkvcon run leaves its mmgplsrv/mmccextr helpers behind as zombies.
    init: true
    labels:
      logging: "promtail"
      logging_project: "disc-ripper-service"
      logging_service: "backend"
    ports:
      - "${RIPPER_PORT:-8083}:8083"
    devices:
      # Optical drive block device plus its SCSI generic node (MakeMKV needs
      # both). Find yours with `lsscsi -g` or `ls -l /dev/sr* /dev/sg*`.
      - "${DISC_DEVICE_PATH:-/dev/sr0}:/dev/sr0"
      - "${DISC_SG_DEVICE_PATH:-/dev/sg0}:${DISC_SG_DEVICE_PATH:-/dev/sg0}"
    # Optional: loads TMDB_API_KEY, LOCALAI_API_KEY etc. from ./.env
    env_file:
      - path: .env
        required: false
    volumes:
      # Intermediate rip output — fast local disk recommended
      - ${RIPS_DIR:-./data/rips}:/data/media/rips
      # Final delivery folder (e.g. a Jellyfin / my-media-manager ingest dir).
      # Mounted at the same path inside the container as INGEST_ROOT so that
      # file paths reported to my-media-manager resolve on both sides.
      - ${INGEST_DIR:-./data/ingest}:${INGEST_ROOT:-/data/ingest}
      - ripper_db:/data/ripper
      # MakeMKV license — the host's ~/.MakeMKV/settings.conf
      - ${MAKEMKV_CONFIG_DIR:-${HOME}/.MakeMKV}:/root/.MakeMKV:ro
    environment:
      RIPS_ROOT: /data/media/rips
      INGEST_ROOT: ${INGEST_ROOT:-/data/ingest}
      DB_PATH: /data/ripper/ripper.db
      LOGS_ROOT: /data/ripper/logs
      MAKEMKVCON_PATH: makemkvcon
      LOCALAI_URL: ${LOCALAI_URL:-http://localhost:8080}
      LOCALAI_API_KEY: "${LOCALAI_API_KEY:-}"
      LOCALAI_ANALYSIS_MODEL: ${LOCALAI_ANALYSIS_MODEL:-qwen2.5-14b}
      MEDIA_MANAGER_API_URL: ${MEDIA_MANAGER_API_URL:-http://localhost:8082}
      HOST_ID: ${HOST_ID:-disc-ripper}
      LOG_PROJECT: disc-ripper-service
      LOG_SERVICE: backend
      LOG_LEVEL: "${LOG_LEVEL:-INFO}"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  ripper_db:
